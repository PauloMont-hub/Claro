<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f9ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Claro · Assistente de escrita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
/* VOICE: calma, editorial, de ferramenta de escrita portuguesa
   IDEA: a app Claro tal como desenhada no Figma, a funcionar
   PICTURE: o próprio ecrã — cartão de escrita, revisão realçada, teclado simulado
   COLOUR and TYPE: azul-marinho #00236f sobre #f8f9ff, tons #e5eeff; Inter 11/13/15/17/28
   LAYOUT: coluna de telemóvel 390–480px, header fixo com blur, navegação inferior */
:root{color-scheme:light dark;
--bg:light-dark(#f8f9ff,#0b1220);--card:light-dark(#fff,#141d30);--ink:light-dark(#0b1c30,#e6ecfa);
--mut:light-dark(#515f74,#9fb0c8);--mut2:light-dark(#444651,#b4bdd0);--out:light-dark(#757682,#8a93a8);
--pri:light-dark(#00236f,#b8c8ff);--pri2:light-dark(#1e3a8a,#3554b0);--onpri:light-dark(#fff,#fff);
--c1:light-dark(#eff4ff,#18233a);--c2:light-dark(#e5eeff,#1d2a45);--c3:light-dark(#dce9ff,#233252);
--tint:light-dark(#d5e3fc,#2a3b5e);--sec:light-dark(#dce1ff,#2b3870);--onsec:light-dark(#00164e,#dce1ff);
--hl:light-dark(rgba(213,227,252,.6),rgba(70,100,170,.35));--dot:light-dark(#c5c5d3,#46506a);
--hdr:light-dark(rgba(248,249,255,.82),rgba(11,18,32,.82));--sh:0 1px 1px rgba(0,0,0,.05)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--pri2);outline-offset:2px}
svg.i{fill:currentColor;flex:none;display:block}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.hdr{position:sticky;top:0;z-index:20;height:calc(64px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top)!important;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--hdr);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 1px 8px rgba(0,0,0,.04)}
.hdr.back{padding:0 8px}
.hl{display:flex;align-items:center;gap:8px}.hdr.back .hl{gap:4px}
.logo{width:46px;height:46px;display:grid;place-items:center}
.logo svg{width:38px;height:38px}
.ttl{font-weight:600;font-size:17px;letter-spacing:-.085px;line-height:22px}
.hr{display:flex;align-items:center;gap:8px}
.ib{min-width:44px;min-height:44px;display:grid;place-items:center;border-radius:99px;color:var(--ink)}
.av{width:32px;height:32px;border-radius:99px;background:var(--pri);color:var(--bg);display:grid;place-items:center}
main{flex:1;padding:0 20px 24px;display:flex;flex-direction:column;gap:16px}
main.p16{padding:8px 16px 24px}
.nav{position:sticky;bottom:0;z-index:20;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)!important;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:0 4px;background:var(--hdr);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 -1px 12px rgba(0,0,0,.03)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;gap:4px;color:var(--mut);text-decoration:none;font-weight:500;font-size:11px;letter-spacing:.22px}
.nav a.on{color:var(--pri2)}
:root[data-theme=dark] .nav a.on{color:var(--pri)}
.cap{font-weight:600;font-size:11px;letter-spacing:.55px;text-transform:uppercase;color:var(--mut);line-height:14px}
.s11{font-size:11px;line-height:14px;letter-spacing:.22px;font-weight:500;color:var(--mut)}
.s13{font-size:13px;line-height:18px;letter-spacing:.13px;font-weight:500}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.g{display:flex;align-items:center;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:20px;margin:0 -20px;padding:2px 20px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{scroll-snap-align:start;height:32px;padding:0 14px;background:var(--c2);color:var(--ink);font-size:13px;font-weight:500;letter-spacing:.13px;flex:none}
.chip.on{background:var(--pri2);color:#fff;box-shadow:var(--sh)}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:16px}
.canvas{min-height:220px;display:flex;flex-direction:column}
.canvas textarea{flex:1;min-height:150px;border:0;resize:none;background:transparent;font-size:17px;line-height:27.6px;letter-spacing:-.05px;padding:8px 0;outline:none}
.canvas textarea::placeholder{color:var(--out)}
.tb{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:32px;font-size:11px;font-weight:500;color:var(--mut);min-height:32px}
.tb:hover{background:var(--c1)}
.tip{background:var(--c1);border-radius:48px;padding:12px;display:flex;gap:12px;align-items:center}
.tip .bub{width:36px;height:36px;border-radius:32px;background:var(--c3);display:grid;place-items:center;color:var(--pri);flex:none}
.tip p{margin:0;font-size:13px;line-height:18px;font-weight:500;color:var(--mut2)}
.seg{display:flex;gap:4px;padding:4px;background:var(--c2);border-radius:48px}
.seg button{flex:1;padding:8px 6px;border-radius:32px;font-size:13px;font-weight:500;color:var(--mut);min-height:36px}
.seg button.on{background:var(--card);color:var(--pri);font-weight:600;box-shadow:var(--sh)}
.trig{position:relative;height:48px;border-radius:48px;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px}
.trig select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;font-size:16px}
.trig span{font-size:15px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp{height:28px;padding:0 12px;font-size:11px;font-weight:500;letter-spacing:.22px;background:var(--c2);color:var(--ink);flex:none;scroll-snap-align:start}
.lp.on{background:var(--pri);color:var(--bg)}
.cta{height:48px;width:100%;border-radius:48px;background:var(--pri2);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:17px;letter-spacing:.2px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1)}
.cta.dk{background:light-dark(#00236f,#3554b0)}
.cta:disabled{opacity:.7;cursor:progress}
.ghost{height:44px;border-radius:48px;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;flex:1}
.err{color:light-dark(#b3261e,#ffb4ab);font-size:13px;text-align:center;margin:0}
.spin{width:18px;height:18px;border-radius:99px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sk{height:16px;border-radius:8px;background:linear-gradient(90deg,var(--c1),var(--c3),var(--c1));background-size:200% 100%;animation:sh 1.2s linear infinite;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.spin,.sk{animation:none}}
/* revisão */
.badge{background:var(--c3);color:var(--pri);padding:4px 10px;font-size:11px;font-weight:600;letter-spacing:.27px}
.badge i{width:6px;height:6px;border-radius:9px;background:var(--pri);display:block}
.coll{background:var(--card);border-radius:24px;box-shadow:0 1px 2px rgba(0,0,0,.05);overflow:hidden}
.coll>button{width:100%;padding:16px;display:flex;align-items:center;justify-content:space-between;color:var(--mut)}
.coll .orig{padding:0 16px 16px;margin:0;color:var(--mut2);font-size:15px;line-height:22px;white-space:pre-wrap}
.res{box-shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);display:flex;flex-direction:column;gap:12px}
.rtxt{font-size:17px;line-height:27.6px;letter-spacing:-.05px;white-space:pre-wrap;margin:0}
.rtxt mark{background:var(--hl);color:var(--pri);font-weight:500;border-radius:12px;padding:1px 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.meter{background:var(--c1);border-radius:48px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.meter .d{display:flex;gap:4px}.meter .d i{width:6px;height:6px;border-radius:9px;background:var(--pri)}
.meter .d i.o{background:var(--dot)}
.seg.reg{padding:6px;align-items:center}
.fine{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.fine button{flex:none;background:var(--card);box-shadow:var(--sh);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center;min-height:36px}
.pro{background:var(--card);border-radius:48px;box-shadow:var(--sh);padding:16px;display:flex;gap:16px;align-items:center}
.pro .bub{width:48px;height:48px;border-radius:48px;background:var(--c2);display:grid;place-items:center;color:var(--pri);flex:none}
.pro b{display:block;font-size:17px;font-weight:600;letter-spacing:-.085px}
.pro small{display:block;font-size:11px;letter-spacing:.22px;color:var(--mut2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(11,28,48,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92dvh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px 16px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 -10px 30px rgba(0,0,0,.15)}
.grab{width:36px;height:4px;border-radius:9px;background:var(--tint);margin:0 auto}
.prev{background:var(--c1);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:12px}
.prev blockquote{margin:0;background:var(--card);padding:14px;font-style:italic;font-weight:500;font-size:15px;line-height:24px;white-space:pre-wrap;max-height:220px;overflow:auto}
.apps{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none}
.apps a,.apps button{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink);text-decoration:none;width:64px}
.apps .ap{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--c1);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;text-align:left;min-height:56px;text-decoration:none;color:var(--ink)}
.tile .bub{width:32px;height:32px;border-radius:99px;background:var(--card);display:grid;place-items:center;flex:none;color:var(--pri)}
.tile b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile[aria-disabled=true]{opacity:.55;cursor:not-allowed}
.sw{width:48px;height:28px;border-radius:99px;background:var(--tint);padding:2px;display:flex;flex:none;transition:background .15s}
.sw::after{content:"";width:24px;height:24px;border-radius:99px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.1);transition:transform .15s}
.sw[aria-checked=true]{background:var(--pri2)}.sw[aria-checked=true]::after{transform:translateX(20px)}
/* histórico */
.h1{font-size:28px;line-height:34px;letter-spacing:-.42px;font-weight:600;margin:3px 0 0}
.search{position:relative}
.search input{width:100%;height:44px;border:0;border-radius:48px;background:var(--c1);padding:0 16px 0 40px;font-size:16px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.search svg{position:absolute;left:14px;top:14px;color:var(--mut)}
.fc{height:32px;padding:0 14px;background:var(--c1);color:var(--mut);font-size:13px;font-weight:500;flex:none;scroll-snap-align:start}
.fc em{font-style:normal;background:var(--c3);color:var(--ink);font-size:11px;padding:2px 6px;border-radius:99px;font-weight:500}
.fc.on{background:var(--pri);color:var(--bg)}.fc.on em{background:var(--pri2);color:#90a8ff;font-weight:600}
.sec{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 0}
.sec b{font-size:13px;font-weight:600;letter-spacing:.65px;text-transform:uppercase;color:var(--mut)}
.hi{display:flex;flex-direction:column;gap:10px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{padding:2px 8px;font-size:11px;font-weight:500;letter-spacing:.22px;background:var(--c3)}
.tg.kx{background:var(--c2);color:var(--pri);padding:4px 10px;gap:4px}
.tg.l{background:var(--c1);color:var(--mut)}.tg.t{background:var(--sec);color:var(--onsec);gap:4px}
.snip{font-size:15px;line-height:20.6px;font-weight:500;margin:0;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.from{background:var(--c1);border-radius:32px;padding:10px;display:flex;gap:8px;font-size:11px;font-style:italic;font-weight:500;color:var(--mut2)}
.from span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{height:32px;padding:0 12px;border-radius:32px;background:var(--c1);display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500}
.star{width:32px;height:32px;border-radius:99px;display:grid;place-items:center;color:var(--mut)}
.star.on{color:#f5a524}
.note{background:var(--c1);border-radius:48px;padding:14px 18px;display:flex;gap:12px;align-items:flex-start;font-size:11px;line-height:17.9px;letter-spacing:.22px;font-weight:500;color:var(--mut2)}
.empty{text-align:center;padding:32px 16px;color:var(--mut)}
.chk{width:22px;height:22px;border-radius:99px;border:2px solid var(--out);display:grid;place-items:center;flex:none}
.chk.on{background:var(--pri2);border-color:var(--pri2);color:#fff}
/* definições */
.grp{display:flex;flex-direction:column;gap:8px}
.grp>h2{margin:0;padding:0 4px;font-size:13px;font-weight:500;color:var(--mut2)}
.list{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:8px;background-clip:padding-box}
.list{background:var(--c1);gap:8px}
.it{background:var(--card);padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;position:relative}
.it .l{display:flex;gap:16px;align-items:center;min-width:0}
.it .bub{width:36px;height:36px;border-radius:99px;background:var(--tint);display:grid;place-items:center;flex:none;color:var(--pri)}
.it b{display:block;font-weight:400;font-size:15px;line-height:21px}
.it small{display:block;font-size:11px;color:var(--mut2);font-weight:500;letter-spacing:.22px}
.it select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;font-size:16px}
.it .v{display:flex;align-items:center;gap:4px;color:var(--pri2);font-size:13px;font-weight:500;white-space:nowrap}
:root[data-theme=dark] .it .v{color:var(--pri)}
/* teclado */
.ctx{background:var(--c1);border-radius:99px;padding:4px 16px;display:flex;justify-content:space-between;align-items:center}
.chat{border-radius:25px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);display:flex;flex-direction:column;gap:12px}
.in{max-width:270px;background:var(--c2);border-radius:25px;padding:8px 16px;font-size:15px;line-height:21px}
.outw{align-self:flex-end;width:min(286px,85%)}
.out{background:var(--c3);border-radius:25px;padding:8px 16px 12px;font-size:15px;line-height:21px;min-height:90px;white-space:pre-wrap;word-break:break-word}
.caret{display:inline-block;width:2px;height:16px;background:var(--pri);vertical-align:-2px;animation:bl 1s step-end infinite}
@keyframes bl{50%{opacity:0}}
.kbd{background:var(--c3);border-radius:25px;overflow:hidden;box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);margin:0 -16px}
.ktb{background:var(--card);display:flex;align-items:center;gap:6px;padding:8px;overflow-x:auto;scrollbar-width:none}
.ktb .br{width:28px;height:28px;border-radius:32px;background:var(--pri2);display:grid;place-items:center;color:#fff;flex:none;margin:0 4px}
.kp{flex:none;height:32px;padding:0 12px;border-radius:99px;background:var(--c2);display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;letter-spacing:.22px;box-shadow:var(--sh)}
.kp.pr{background:var(--pri);color:var(--bg);font-weight:600}
.sug{margin:4px 8px 0;background:var(--card);border-radius:25px;padding:16px 16px 16px 20px;box-shadow:0 10px 15px -3px rgba(0,0,0,.1);display:flex;flex-direction:column;gap:10px}
.sug p{margin:0;font-size:15px;line-height:24.4px;font-weight:500}
.dif{display:inline-flex;gap:4px;align-items:center;background:var(--c1);border-radius:6px;padding:2px 8px;font-size:11px;color:var(--mut);font-weight:500;max-width:100%}
.dif span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keys{padding:8px 4px;display:flex;flex-direction:column;gap:8px}
.kr{display:flex;gap:4px;padding:0 2px}
.k{flex:1;height:44px;border-radius:16px;background:var(--card);box-shadow:var(--sh);font-size:17px;font-weight:600;display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.k:active{background:var(--c2)}
.k.f{flex:none;width:44px;background:var(--c2)}.k.w{flex:none;padding:0 12px;width:auto;font-size:13px;font-weight:500;background:var(--c2)}
.k.sp{font-size:13px;font-weight:500;color:var(--mut)}
.k.rt{flex:none;padding:0 16px;width:auto;background:var(--pri);color:var(--bg);font-size:13px}
.k.on{background:var(--pri2);color:#fff}
/* ativar */
.step{background:var(--card);border-radius:25px;box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:16px}
.step .t{display:flex;gap:16px;align-items:flex-start}
.step .n{width:28px;height:28px;border-radius:99px;background:var(--c3);display:grid;place-items:center;color:var(--pri);font-weight:700;font-size:13px;flex:none}
.step h3{margin:0 0 2px;font-size:17px;font-weight:600;letter-spacing:-.085px}
.step p{margin:0;color:var(--mut2);font-size:15px;line-height:21px}
.step p b{color:var(--ink);font-weight:600}
.mock{margin-left:44px;background:var(--c1);border-radius:32px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:500}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;font-weight:500;max-width:calc(100vw - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.dlg{background:var(--card);border-radius:24px;margin:16px;padding:20px;max-width:420px;display:flex;flex-direction:column;gap:10px;align-self:center}
.dlg h3{margin:0;font-size:17px}.dlg p{margin:0;font-size:14px;color:var(--mut2)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app" id="app"></div>

Responde APENAS com JSON válido, sem texto antes ou depois, neste formato:
{"text":"texto final completo","segments":[{"t":"pedaço","c":true}],"changes":[{"de":"original","para":"novo"}],"nota":"resumo da melhoria em até 45 caracteres","destaque":{"titulo":"até 28 caracteres","descricao":"até 55 caracteres"},"fluidez":4}
Regras: "segments" concatenados têm de reproduzir exatamente "text"; "c" é true nas partes novas ou alteradas em relação ao original. "changes": até 3 trocas mais relevantes, curtas. "fluidez": 1 a 4.`}
function parseJ(r){if(r&&typeof r==='object'&&!('text' in r&&typeof r.text==='string'&&'truncated' in r))return r;let t=typeof r==='string'?r:r?.text||'';t=t.replace(/^```(json)?/m,'').replace(/```\s*$/m,'');const a=t.indexOf('{'),b=t.lastIndexOf('}');return JSON.parse(t.slice(a,b+1))}
async function rewrite(o){const r=await callAI(prompt(o));
const j=parseJ(r);if(!j||typeof j.text!=='string')throw{code:'bad'};
let seg=Array.isArray(j.segments)?j.segments.filter(x=>x&&typeof x.t==='string'):[];
if(seg.map(x=>x.t).join('')!==j.text)seg=[{t:j.text,c:false}];
return{text:j.text,segments:seg,changes:(j.changes||[]).filter(c=>c&&c.de&&c.para).slice(0,3),nota:String(j.nota||'Fluidez e cortesia revistas'),destaque:j.destaque&&j.destaque.titulo?j.destaque:{titulo:'Precisão Sintática Lusitana',descricao:'Colocação pronominal e vocabulário de Portugal'},fluidez:Math.max(1,Math.min(4,+j.fluidez||4))}}
function errMsg(e){const c=e&&e.code;if(c==='nokey')return'Falta a chave da API. Vai a Definições › Ligação à IA.';if(c==='badkey')return'A chave da API não é válida. Confirma-a em Definições.';if(c==='rate_limited')return'Atingiste o limite gratuito por agora. Espera um minuto (ou até amanhã, se for o limite diário).';if(c==='busy')return'O Gemini está sobrecarregado. Tenta daqui a pouco.';if(c==='nomodel')return'Modelo indisponível. Escolhe outro em Definições › Modelo.';if(c==='blocked')return'O Gemini não devolveu resposta para este texto. Tenta reformular.';if(c==='net')return'Sem ligação à internet.';if(c==='http')return'Erro da API ('+e.status+')'+(e.message?': '+e.message:'');return'Não foi possível melhorar o texto. Tenta outra vez.'}

function vHist(){const q=ui.q.trim().toLowerCase();

let L=H.filter(x=>ui.filter==='todos'||(ui.filter==='fav'&&x.fav)||(ui.filter==='email'&&x.ctx==='email')||(ui.filter==='msg'&&x.ctx==='mensagem'));
if(q)L=L.filter(x=>(x.text+' '+x.original).toLowerCase().includes(q));
L.sort((a,b)=>ui.asc?a.ts-b.ts:b.ts-a.ts);
const day=t=>{const a=new Date();a.setHours(0,0,0,0);const d=Math.floor((a-new Date(t).setHours(0,0,0,0))/864e5);return d<=0?'Hoje':d===1?'Ontem':d<7?'Esta semana':'Anteriores'};

case'ios':toast('O teclado real chega com a app iOS');break;
case'tip':ui.tip=(ui.tip+1)%TIPS.length;render(1);break;
case'paste':try{const t=await navigator.clipboard.readText();if(t){S.draft=(S.draft?S.draft+'\n':'')+t;render(1)}else toast('Área de transferência vazia')}catch(_){$('#draft').focus();toast('Mantém o dedo no campo e escolhe «Colar»')}break;
case'clear':S.draft='';ui.err='';render(1);$('#draft').focus();break;
case'go':if(!S.draft.trim()){ui.err='Escreve ou cola primeiro o texto que queres melhorar.';render(1);break}run({text:S.draft,ctx:S.ctx,tone:S.tone,lang:S.lang});break;
case'orig':ui.origOpen=!ui.origOpen;render(1);break;
case'copy':copy(cur.res.text);break;
case'again':run({text:cur.original,ctx:cur.ctx,tone:cur.tone,lang:cur.lang,prev:cur.res.text});break;
case'share':openShare(curItem());break;
case'closesh':case'closeov':$('#layer').innerHTML='';break;
case'cmp':sh.cmp=!sh.cmp;$('#layer').innerHTML=vShare();break;
case'sig':sh.sig=!sh.sig;$('#layer').innerHTML=vShare();break;
case'copysh':copy(shareText(),d.m);break;
case'copyfmt':{const f=sh.fmt;sh.fmt='md';const t=shareText();sh.fmt=f;copy(t,'Copiado em Markdown')}break;
case'copyplain':{const f=sh.fmt;sh.fmt='puro';const t=shareText();sh.fmt=f;copy(t,'Texto simples copiado')}break;
case'native':nativeShare();break;
case'selmode':ui.sel=ui.sel?null:new Set();render(1);break;
case'delsel':if(ui.sel.size){H=H.filter(x=>!ui.sel.has(x.id));toast(ui.sel.size+' registo(s) apagado(s)')}ui.sel=null;render(1);break;
case'sort':ui.asc=!ui.asc;render(1);break;
case'wipe':H=[];cur=null;toast('Histórico apagado');render(1);break;
case'krw':kRewrite(false);break;case'krw2':kRewrite(true);break;
case'ktone':{const i=TONES.findIndex(t=>t[0]===K.tone);K.tone=TONES[(i+1)%3][0];render(1)}break;
case'klang':{const i=LANGS.findIndex(l=>l[0]===K.lang);K.lang=LANGS[(i+1)%LANGS.length][0];render(1)}break;
case'krep':K.prev=K.draft;K.draft=K.sug.text;K.sug=null;render(1);break;
case'kundo':if(K.prev!=null){K.draft=K.prev;K.prev=null;render(1)}break;
case'kclose':K.sug=null;render(1);break}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#layer').innerHTML)$('#layer').innerHTML=''});
route=V[location.hash.slice(1)]?location.hash.slice(1):'escrever';render();
}
</script>
</body>
</html>
